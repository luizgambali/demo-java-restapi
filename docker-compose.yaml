services:

  api:
    build: .
    container_name: demo-api

    ports:
      - "5000:5000"

    environment:
      DB_URL: jdbc:sqlite:/data/customers.db
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

    volumes:
      - sqlite-data:/data

    restart: unless-stopped

volumes:
  sqlite-data:
