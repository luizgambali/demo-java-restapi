spring.application.name=demo
spring.datasource.url=${DB_URL:jdbc:sqlite:customers.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=5000

# Required in every environment. Keep the value only in .env or in the host's
# secret manager; it must be at least 32 bytes for HS256.
jwt.secret=${JWT_SECRET}

# Optional: creates an initial administrator only when both values are set.
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
